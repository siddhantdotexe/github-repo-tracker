spring.application.name=github-repo-tracker

# H2 Database configuration
spring.datasource.url=jdbc:h2:mem:githubdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Web Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# Externalized GitHub API configuration
github.api.base-url=https://api.github.com

# Logging
logging.level.com.tracker.githubtracker=INFO
logging.level.org.springframework.web=INFO
